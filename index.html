<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <title>MinePulse</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="app-header">
      <div class="header-left">
        <span class="logo-text">MinePulse</span>
      </div>
      <div class="header-right">
        <button class="icon-btn" id="notif-btn">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
        </button>
        <button class="icon-btn" id="profile-btn">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Dashboard Page -->
      <section id="page-dashboard" class="page active">
        <div class="welcome-card">
          <h1>Welcome back</h1>
          <p class="subtitle">Your mining dashboard is ready.</p>
        </div>
        <div class="stats-grid">
          <div class="stat-card">
            <span class="stat-label">Today's Earnings</span>
            <span class="stat-value">₹0.00</span>
          </div>
          <div class="stat-card">
            <span class="stat-label">Hashrate</span>
            <span class="stat-value">0 H/s</span>
          </div>
          <div class="stat-card">
            <span class="stat-label">Status</span>
            <span class="stat-value" style="color:#34D399;">● Inactive</span>
          </div>
        </div>
        <button class="btn-primary full-width" id="start-btn">START MINING</button>
      </section>

      <!-- Mining Page (Placeholder) -->
      <section id="page-mining" class="page">
        <h2>Mining</h2>
        <p>Mining controls will appear here.</p>
      </section>

      <!-- Earnings Page (Placeholder) -->
      <section id="page-earnings" class="page">
        <h2>Earnings</h2>
        <p>Earnings history will appear here.</p>
      </section>

      <!-- Wallet Page (Placeholder) -->
      <section id="page-wallet" class="page">
        <h2>Wallet</h2>
        <p>Wallet and payouts will appear here.</p>
      </section>

      <!-- More Page (Placeholder) -->
      <section id="page-more" class="page">
        <h2>More</h2>
        <p>Settings and support will appear here.</p>
      </section>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
      <button class="nav-item active" data-page="page-dashboard">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 12L12 3l9 9"/>
          <path d="M5 10v10h14V10"/>
        </svg>
        <span>Home</span>
      </button>
      <button class="nav-item" data-page="page-mining">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 3L3 8l9 5 9-5-9-5z"/>
          <path d="M3 8v8l9 5 9-5V8"/>
        </svg>
        <span>Mining</span>
      </button>
      <button class="nav-item" data-page="page-earnings">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <path d="M12 6v12M8 10l4-2 4 2"/>
        </svg>
        <span>Earnings</span>
      </button>
      <button class="nav-item" data-page="page-wallet">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="2" y="5" width="20" height="14" rx="2"/>
          <path d="M16 10h4"/>
        </svg>
        <span>Wallet</span>
      </button>
      <button class="nav-item" data-page="page-more">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="5" r="1"/>
          <circle cx="12" cy="12" r="1"/>
          <circle cx="12" cy="19" r="1"/>
        </svg>
        <span>More</span>
      </button>
    </nav>
  </div>

  <script src="app.js"></script>
</body>
            </html>
